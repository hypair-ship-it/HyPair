<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@font-face{font-family:'BC';src:url('../../../../web/assets/fonts/barlow-condensed-900.woff2');font-weight:900}
@font-face{font-family:'BC';src:url('../../../../web/assets/fonts/barlow-condensed-700.woff2');font-weight:700}
@font-face{font-family:'B';src:url('../../../../web/assets/fonts/barlow-500.woff2');font-weight:500}
html,body{margin:0;padding:0;background:#EDE7E3}

.logo span{font:900 34px 'BC';letter-spacing:2px;color:#0F1117;text-transform:uppercase}
.eyebrow{position:absolute;left:80px;top:170px;font:700 26px 'BC';letter-spacing:6px;color:#E22424;text-transform:uppercase}

.screen img{position:absolute;left:0;top:0;width:612px}
</style></head><body><div class="post"><div class="logo"><img src="../../../../brand/print/assets/hypair-app-icon.png"><span>HyPair</span></div><div class="eyebrow">Join a race</div><div class="head">Got a ticket?<br>Say so.</div><div class="sub">Tick the box and other athletes can find you by ticket status.</div><div class="phone" style="top:490px"><div class="screen"><img src="reg-ticket-on.png"></div></div></div></body></html>
