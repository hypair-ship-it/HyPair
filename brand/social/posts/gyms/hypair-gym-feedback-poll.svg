  </g>
  <text x="142" y="122" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1" fill="#F2D079">HyPair</text>

  <text x="80" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#E22424">SO... DID OUR EMAIL LAND?</text>
  <text x="78" y="390" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff">We tried the door.</text>
  <text x="78" y="465" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff">Now we're at the</text>
  <text x="78" y="540" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff">window.</text>

  <text x="78" y="650" font-family="Arial, sans-serif" font-size="27" fill="rgba(255,255,255,0.75)">No strings attached — just want you to try</text>
  <text x="78" y="688" font-family="Arial, sans-serif" font-size="27" fill="rgba(255,255,255,0.75)">HyPair free, and tell us honestly if it's useful.</text>
  <text x="78" y="726" font-family="Arial, sans-serif" font-size="27" fill="rgba(255,255,255,0.75)">Got 10 seconds? Tell us which is closest to you:</text>

  <rect x="78" y="800" width="924" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="112" y="855" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#F2D079">1</text>
  <text x="160" y="855" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">We don't run sims —</text>
  <text x="160" y="895" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">not really for us</text>

  <rect x="78" y="954" width="924" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="112" y="1009" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#F2D079">2</text>
  <text x="160" y="1009" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Already looked — our sims are</text>
  <text x="160" y="1049" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">full and well organised</text>

  <rect x="78" y="1108" width="924" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="112" y="1163" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#F2D079">3</text>
  <text x="160" y="1163" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Just come by the gym if</text>
  <text x="160" y="1203" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">you want to talk</text>

  <rect x="78" y="1262" width="924" height="130" rx="16" fill="rgba(255,255,255,0.06)"/>
  <text x="112" y="1327" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#F2D079">4</text>
  <text x="160" y="1327" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Something else — tell us!</text>

  <text x="78" y="1470" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.6)">No pressure either way — genuinely just want to</text>
  <text x="78" y="1508" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.6)">know if this is worth chasing or not.</text>

  <text x="78" y="1760" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#F2D079">GET HYPAIR FREE</text>
  <text x="78" y="1806" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">hypair.app</text>

  <text x="540" y="1898" font-family="Arial, sans-serif" fill="#F2D079" text-anchor="middle"><tspan font-size="52" font-weight="700">&#8595; </tspan><tspan font-size="24" font-weight="700" letter-spacing="1">NEED MORE INFO TO DECIDE? SCROLL DOWN</tspan><tspan font-size="52" font-weight="700"> &#8595;</tspan></text>
</svg>
