name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: web/

      - name: Check vercel.json rewrites point to real files
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
            let ok = true;
            for (const r of cfg.rewrites || []) {
              const path = 'web' + r.destination;
              if (!fs.existsSync(path)) {
                console.error('Missing rewrite target: ' + r.destination);
                ok = false;
              }
            }
            process.exit(ok ? 0 : 1);
          "
