name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: web/
          blacklist: googleb13411129c6994e3.html
          extra: --ignore-re "too few values for the property .linear-gradient."

      - name: Check vercel.json rewrites point to real files
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
            let ok = true;
            for (const r of cfg.rewrites || []) {
              const path = 'web' + r.destination;
              // cleanUrls: true resolves an extensionless destination to its
              // .html file automatically on Vercel, so check both forms.
              if (!fs.existsSync(path) && !fs.existsSync(path + '.html')) {
                console.error('Missing rewrite target: ' + r.destination);
                ok = false;
              }
            }
            process.exit(ok ? 0 : 1);
          "

      - name: Check brand colours are consistent across web/*.html
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            // Canonical Swiss Alps palette — see brand/BRAND.md §3.
            // Every web page hardcodes its own :root block and SVG fills
            // (no shared stylesheet), so drift has to be caught by scanning
            // literal hex values, not by trusting a single source file.
            const CANONICAL = {
              gold: '#F2D079',   // Sun Valley — logo / brand accent
              red: '#E22424',    // Swiss Alps Red — CTAs
              summit: '#2C3A47', // Summit Dark — nav/text
            };
            const CANONICAL_HEXES = new Set(Object.values(CANONICAL).map(h => h.toLowerCase()));

            // Historical invented/off-spec values that have drifted in before.
            // Any occurrence of these anywhere means a page reverted or copied
            // from a stale template. Checked in both hex and decimal rgb(a)
            // form — a past drift slipped through as rgba(248,198,98,...),
            // the decimal form of #F8C662, which a hex-only scan missed.
            const BLOCKLIST = ['#D4AA50', '#F8C662', '#E53935'].map(h => h.toLowerCase());
            const hexToRgbTriplet = (hex) => {
              const n = hex.slice(1);
              const full = n.length === 3 ? n.split('').map(c => c + c).join('') : n;
              const r = parseInt(full.slice(0, 2), 16);
              const g = parseInt(full.slice(2, 4), 16);
              const b = parseInt(full.slice(4, 6), 16);
              return \`\${r},\\\\s*\${g},\\\\s*\${b}\`;
            };
            const BLOCKLIST_RGB_RE = BLOCKLIST.map(h => new RegExp('rgba?\\\\(\\\\s*' + hexToRgbTriplet(h) + '\\\\b', 'i'));

            const dir = 'web';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.html'));
            let ok = true;

            for (const file of files) {
              const full = path.join(dir, file);
              const text = fs.readFileSync(full, 'utf8');
              const lower = text.toLowerCase();

              for (const bad of BLOCKLIST) {
                if (lower.includes(bad)) {
                  console.error(\`\${full}: found deprecated brand colour \${bad} — should be one of \${JSON.stringify(CANONICAL)}\`);
                  ok = false;
                }
              }

              for (let i = 0; i < BLOCKLIST.length; i++) {
                if (BLOCKLIST_RGB_RE[i].test(text)) {
                  console.error(\`\${full}: found deprecated brand colour \${BLOCKLIST[i]} in decimal rgb(a) form — should be one of \${JSON.stringify(CANONICAL)}\`);
                  ok = false;
                }
              }

              // --gold / --red CSS custom properties must match canonical exactly.
              for (const [name, canonicalHex] of Object.entries(CANONICAL)) {
                if (name === 'summit') continue; // not exposed as a CSS var everywhere
                const re = new RegExp('--' + name + '(?:-[a-z]+)?:\\\\s*(#[0-9A-Fa-f]{3,6})\\\\b', 'g');
                let m;
                while ((m = re.exec(text))) {
                  const varName = m[0].split(':')[0].trim();
                  if (varName !== '--' + name) continue; // skip --gold-dim, --gold-border, etc.
                  if (m[1].toLowerCase() !== canonicalHex.toLowerCase()) {
                    console.error(\`\${full}: \${varName} is \${m[1]}, expected \${canonicalHex}\`);
                    ok = false;
                  }
                }
              }

              // Hardcoded SVG fills must be one of the canonical brand hexes.
              const fillRe = /fill=\"(#[0-9A-Fa-f]{3,6})\"/g;
              let fm;
              while ((fm = fillRe.exec(text))) {
                if (!CANONICAL_HEXES.has(fm[1].toLowerCase())) {
                  console.error(\`\${full}: hardcoded fill=\${fm[1]} is not a canonical brand colour (\${JSON.stringify(CANONICAL)})\`);
                  ok = false;
                }
              }
            }

            process.exit(ok ? 0 : 1);
          "
